name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qcore
          POSTGRES_USER: qcore
          POSTGRES_PASSWORD: qcore
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Gofmt
        run: |
          fmt=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$fmt" ]; then
            echo "::error::gofmt needed on:"; echo "$fmt"
            echo "Run: gofmt -w cmd pkg"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Build all binaries
        run: |
          for cmd in amf ausf dashboard hss mme nrf qcore-cli qcore-collector smf spgw udm udr upf; do
            echo "Building $cmd..."
            go build -o bin/qcore-$cmd ./cmd/$cmd
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: qcore-binaries
          path: bin/

  # linux-integration runs Linux-kernel-dependent tests that need
  # CAP_NET_ADMIN (e.g. /dev/net/tun for SPGW egress). GitHub Actions
  # ubuntu-latest runners grant passwordless sudo, so we re-exec `go
  # test` under sudo preserving PATH so the tool-cache Go binary is
  # reachable. This is the scaffolding the 5G-SA pivot (see
  # docs/rfc/0001-5g-sba-pivot.md) depends on for UERANSIM and NGAP
  # integration now that native SCTP has landed.
  linux-integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Show kernel + tun support
        run: |
          uname -a
          ls -l /dev/net/tun || true
          sudo modprobe tun || true
          ls -l /dev/net/tun

      - name: Run Linux TUN smoke (CAP_NET_ADMIN required)
        run: |
          sudo -E env "PATH=$PATH" go test -v -count=1 \
            -run 'TestTUNEgress_' \
            ./pkg/spgw/

      # UERANSIM-driven smoke lives in ueransim-interop.yml because it needs the
      # full 5G compose profile, kernel SCTP, TUN, and evidence capture. As of
      # 2026-06-08 it validates registration, PDU session establishment, and UE
      # ping over uesimtun0 for the bundled profile.
      - name: UERANSIM smoke (covered by ueransim-interop.yml)
        run: |
          echo "SKIPPED: full UERANSIM T10 smoke lives in ueransim-interop.yml."
          echo "See ueransim-interop.yml for registration + PDU session + data-plane evidence."
          echo "See docs/ueransim-compat.md and docs/v1-gap-closure-plan.md (T10)."
