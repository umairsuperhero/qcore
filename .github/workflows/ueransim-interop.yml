name: ueransim-interop
# T10 real-RAN validation: bring up the 5G stack + a real UERANSIM gNB/UE over
# native kernel SCTP and assert the UE registers (i.e. gets PAST the Security
# Mode Command). GitHub-hosted ubuntu runners support SCTP + TUN + Docker
# (verified), so this is our cloud-Linux validation for T10 / PR #28.
on:
  push:
    branches: [fix/t10-kamf-supi-prefix]
  workflow_dispatch:

jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROFILES: "5g"
      COMPOSE: "docker compose -f deployments/docker/docker-compose.yml"
    steps:
      - uses: actions/checkout@v4

      - name: Load kernel modules (SCTP + TUN)
        run: |
          sudo modprobe sctp
          sudo modprobe tun
          ls -l /dev/net/tun
          [ -e /proc/net/sctp ] && echo "SCTP ready" || (echo "no SCTP" && exit 1)

      - name: Bring up 5G stack + UERANSIM (AMF in SCTP mode)
        run: |
          $COMPOSE up -d --build
          echo "--- containers ---"
          $COMPOSE ps

      - name: Validate — UE must get past the SMC (no integrity failure)
        id: outcome
        run: |
          # This branch's claim is the SMC-integrity fix. So the gate is:
          #   PASS  = UE reaches the SMC and does NOT reject it for integrity
          #   FAIL  = "integrity check failed" (regression of this fix), or the
          #           flow never even reaches the SMC (earlier-stage breakage)
          # Full registration is a SEPARATE, later T10 milestone (the Reg-Accept /
          # InitialContextSetupRequest blocker) and is reported as info, not a fail.
          echo "Watching the UERANSIM UE for the SMC outcome (up to ~150s)..."
          REACHED_SMC=0; INTEGRITY_FAILED=0; REGISTERED=0
          for i in $(seq 1 30); do
            LOGS="$($COMPOSE logs ueransim-ue 2>/dev/null || true)"
            echo "$LOGS" | grep -qiE "Security Mode Command received" && REACHED_SMC=1
            echo "$LOGS" | grep -qi  "Security Mode Command integrity check failed" && INTEGRITY_FAILED=1
            echo "$LOGS" | grep -qiE "Registration is successful|MM-REGISTERED|PDU Session establishment is successful" && REGISTERED=1
            if [ "$INTEGRITY_FAILED" = 1 ] || [ "$REGISTERED" = 1 ]; then break; fi
            if [ "$REACHED_SMC" = 1 ] && [ "$i" -ge 6 ]; then break; fi
            sleep 5
          done
          echo "reached_smc=$REACHED_SMC integrity_failed=$INTEGRITY_FAILED registered=$REGISTERED"
          if [ "$INTEGRITY_FAILED" = 1 ]; then
            echo "::error::REGRESSION — UERANSIM rejected the SMC for integrity (this PR's fix is broken)"
            exit 1
          fi
          if [ "$REACHED_SMC" != 1 ]; then
            echo "::error::UE never reached the Security Mode Command — earlier-stage failure (see log dump)"
            exit 1
          fi
          if [ "$REGISTERED" = 1 ]; then
            echo "::notice::FULL REGISTRATION — T10 end-to-end works against real UERANSIM."
          else
            echo "::notice::PR scope OK — UE accepted the SMC (no integrity failure). Full registration is not yet complete: known downstream blocker = Registration Accept / InitialContextSetupRequest (next T10 step), not this PR."
          fi

      - name: Dump logs (always)
        if: always()
        run: |
          echo "===== AMF ====="; $COMPOSE logs amf 2>&1 | tail -150 || true
          echo "===== UERANSIM gNB ====="; $COMPOSE logs ueransim 2>&1 | tail -150 || true
          echo "===== UERANSIM UE ====="; $COMPOSE logs ueransim-ue 2>&1 | tail -150 || true

      - name: Teardown
        if: always()
        run: $COMPOSE down -v || true
