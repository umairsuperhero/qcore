services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qcore
      POSTGRES_USER: qcore
      POSTGRES_PASSWORD: qcore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qcore"]
      interval: 5s
      timeout: 5s
      retries: 5

  collector:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.collector
    ports:
      - "9099:9099"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9099/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  hss:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.hss
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      collector:
        condition: service_healthy
    environment:
      QCORE_DATABASE_HOST: postgres
      QCORE_DATABASE_PORT: "5432"
      QCORE_DATABASE_USER: qcore
      QCORE_DATABASE_PASSWORD: qcore
      QCORE_DATABASE_NAME: qcore
      QCORE_DATABASE_SSL_MODE: disable
      QCORE_LOGGING_FORMAT: json
      QCORE_TELEMETRY_COLLECTOR_URL: http://collector:9099
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  spgw:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.spgw
    ports:
      - "2152:2152/udp"
      - "8082:8082"
      - "9092:9092"
    depends_on:
      collector:
        condition: service_healthy
    environment:
      QCORE_SPGW_BIND_ADDRESS: 0.0.0.0
      QCORE_SPGW_SGW_U1_ADDR: spgw
      QCORE_METRICS_PORT: "9092"
      QCORE_LOGGING_FORMAT: json
      QCORE_TELEMETRY_COLLECTOR_URL: http://collector:9099
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  mme:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.mme
    ports:
      - "36412:36412"
      - "8081:8081"
      - "9091:9091"
    depends_on:
      hss:
        condition: service_healthy
      spgw:
        condition: service_healthy
      collector:
        condition: service_healthy
    environment:
      QCORE_MME_HSS_URL: http://hss:8080
      QCORE_MME_SPGW_URL: http://spgw:8082
      QCORE_MME_BIND_ADDRESS: 0.0.0.0
      QCORE_MME_SCTP_MODE: tcp
      QCORE_METRICS_PORT: "9091"
      QCORE_LOGGING_FORMAT: json
      QCORE_TELEMETRY_COLLECTOR_URL: http://collector:9099

  dashboard:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.dashboard
    ports:
      - "3000:3000"
    depends_on:
      hss:
        condition: service_healthy
      spgw:
        condition: service_healthy
      collector:
        condition: service_healthy
    environment:
      QCORE_DASHBOARD_BIND_ADDRESS: 0.0.0.0
      QCORE_DASHBOARD_PORT: "3000"
      QCORE_DASHBOARD_HSS_URL: http://hss:8080
      QCORE_DASHBOARD_MME_URL: http://mme:8081
      QCORE_DASHBOARD_MME_S1AP_ADDR: mme:36412
      QCORE_DASHBOARD_AMF_NGAP_ADDR: amf:38412
      QCORE_AMF_SCTP_MODE: ${QCORE_AMF_SCTP_MODE:-sctp}
      QCORE_DASHBOARD_SPGW_URL: http://spgw:8082
      QCORE_DASHBOARD_COLLECTOR_URL: http://collector:9099
      QCORE_DASHBOARD_SCENARIO_DIR: /var/lib/qcore/scenarios
      QCORE_LOGGING_FORMAT: json
      # Diagnostic AI backend. Default is the offline SLM sidecar (no key); it
      # only escalates to a model after the deterministic catalog misses, and if
      # the sidecar isn't running it degrades to a graceful "run make up-ai"
      # answer. Override QCORE_AI_PROVIDER=gemini + QCORE_AI_API_KEY=<key> for
      # cloud escalation instead.
      QCORE_AI_PROVIDER: ${QCORE_AI_PROVIDER:-local}
      QCORE_AI_LOCAL_URL: ${QCORE_AI_LOCAL_URL:-http://qcore-slm:8088/v1}
      QCORE_AI_MODEL: ${QCORE_AI_MODEL:-qwen2.5-1.5b-instruct}
      QCORE_AI_API_KEY: ${QCORE_AI_API_KEY:-}
    volumes:
      # Persist authored scenarios across container recreation (make down/up).
      - qcore-scenarios:/var/lib/qcore/scenarios

  # 5G SA NFs — NRF → UDR → UDM → AUSF → AMF (startup dependency order).
  # All 5G services are behind the "5g" Compose profile so the default
  # `make up` brings up only the 4G golden path. Start 5G with `make up-5g`
  # (or `COMPOSE_PROFILES=5g docker compose ... up`).
  nrf:
    profiles: ["5g"]
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.nrf
    ports:
      - "8083:8083"
    environment:
      QCORE_NRF_BIND_ADDRESS: 0.0.0.0
      QCORE_NRF_PORT: "8083"
      QCORE_LOGGING_FORMAT: json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  udr:
    profiles: ["5g"]
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.udr
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      nrf:
        condition: service_healthy
    environment:
      QCORE_UDR_BIND_ADDRESS: 0.0.0.0
      QCORE_UDR_PORT: "8084"
      QCORE_UDR_NRF_URL: http://nrf:8083
      QCORE_DATABASE_HOST: postgres
      QCORE_DATABASE_PORT: "5432"
      QCORE_DATABASE_USER: qcore
      QCORE_DATABASE_PASSWORD: qcore
      QCORE_DATABASE_NAME: qcore
      QCORE_DATABASE_SSL_MODE: disable
      QCORE_RESET_DEMO_SUBSCRIBER: "true"
      QCORE_LOGGING_FORMAT: json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  udm:
    profiles: ["5g"]
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.udm
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      nrf:
        condition: service_healthy
    environment:
      QCORE_UDM_BIND_ADDRESS: 0.0.0.0
      QCORE_UDM_PORT: "8085"
      QCORE_UDM_NRF_URL: http://nrf:8083
      QCORE_UDM_UDR_URL: ""
      QCORE_UDM_PLMN: "00101"
      QCORE_DATABASE_HOST: postgres
      QCORE_DATABASE_PORT: "5432"
      QCORE_DATABASE_USER: qcore
      QCORE_DATABASE_PASSWORD: qcore
      QCORE_DATABASE_NAME: qcore
      QCORE_DATABASE_SSL_MODE: disable
      QCORE_RESET_DEMO_SUBSCRIBER: "true"
      QCORE_LOGGING_FORMAT: json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  ausf:
    profiles: ["5g"]
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.ausf
    ports:
      - "8086:8086"
    depends_on:
      udm:
        condition: service_healthy
      nrf:
        condition: service_healthy
    environment:
      QCORE_AUSF_BIND_ADDRESS: 0.0.0.0
      QCORE_AUSF_PORT: "8086"
      QCORE_AUSF_NRF_URL: http://nrf:8083
      QCORE_AUSF_UDM_URL: http://udm:8085
      QCORE_LOGGING_FORMAT: json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  amf:
    profiles: ["5g"]
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.amf
    ports:
      - "38412:38412"
      - "8087:8087"
    depends_on:
      ausf:
        condition: service_healthy
      nrf:
        condition: service_healthy
    environment:
      QCORE_AMF_BIND_ADDRESS: 0.0.0.0
      QCORE_AMF_NGAP_PORT: "38412"
      QCORE_AMF_API_PORT: "8087"
      QCORE_AMF_PLMN: "00101"
      QCORE_AMF_SCTP_MODE: sctp
      QCORE_AMF_SERVING_NETWORK_NAME: "5G:mnc001.mcc001.3gppnetwork.org"
      QCORE_AMF_NRF_URL: http://nrf:8083
      QCORE_AMF_AUSF_URL: http://ausf:8086
      QCORE_AMF_SMF_URL: http://smf:8002
      QCORE_AMF_AMF_INSTANCE_ID: "00000000-0000-0000-0000-000000000001"
      QCORE_AMF_TRACE_NGAP_HEX: ${QCORE_AMF_TRACE_NGAP_HEX:-false}
      QCORE_LOGGING_FORMAT: json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  ueransim-gnb:
    profiles: ["5g"]
    image: free5gc/ueransim:latest
    depends_on:
      amf:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    volumes:
      - ./ueransim-config/gnb.yaml:/ueransim/config/gnb.yaml
    command: /ueransim/nr-gnb -c /ueransim/config/gnb.yaml

  ueransim-ue:
    profiles: ["5g"]
    image: free5gc/ueransim:latest
    depends_on:
      amf:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    volumes:
      - ./ueransim-config/ue.yaml:/ueransim/config/ue.yaml
    command: /bin/bash -lc "ulimit -c unlimited; sleep 5; /ueransim/nr-ue -c /ueransim/config/ue.yaml; code=$$?; echo UERANSIM_NR_UE_EXIT_CODE=$$code; ls -l core* /ueransim/core* 2>/dev/null || true; sleep 2; exit $$code"

  smf:
    profiles: ["5g"]
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.smf
    ports:
      - "8002:8002"
    depends_on:
      nrf:
        condition: service_healthy
    environment:
      SBI_BINDADDRESS: 0.0.0.0
      SBI_ADVERTISEADDRESS: smf
      SBI_PORT: "8002"
      SBI_NRFURL: http://nrf:8083
      SMF_IPPOOLCIDR: "10.45.0.0/16"
      SMF_UPFPFCPADDR: "upf:8805"
      SMF_LOCALPFCPIP: "smf"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8002/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  upf:
    profiles: ["5g"]
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.upf
    # N3 (GTP-U 2152) and N4 (PFCP 8805) are reached in-network as upf:2152 /
    # upf:8805 by the bundled gNB/SMF, so they are NOT published to the host.
    # This avoids colliding with the 4G SPGW, which owns host UDP 2152. If you
    # ever attach an external gNB to the UPF, stop the 4G spgw and add a host
    # port mapping here.
    expose:
      - "8805/udp"
      - "2152/udp"
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      UPF_PFCPBINDADDR: 0.0.0.0:8805
      UPF_GTPUBINDADDR: 0.0.0.0:2152
      UPF_TUNDEVICENAME: "qcore-upf"
      UPF_TUNIPV4CIDR: "10.45.0.1/16"
      UPF_ENABLENAT: "true"

  # Offline diagnostic SLM (charter §9.3 / gap-closure B2). Serves a small
  # instruct model over an OpenAI-compatible API so the Diagnostic AI explains
  # failures with no cloud account and no API key. Behind the "ai" profile so
  # the default `make up` stays lean (~1 GB model image); bring it up with
  # `make up-ai`, which also points the dashboard at it.
  qcore-slm:
    profiles: ["ai"]
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.slm
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s


volumes:
  pgdata:
  qcore-scenarios:
