hss:
  name: "qcore-hss"
  bind_address: "0.0.0.0"
  api_port: 8080

mme:
  name: "qcore-mme"
  bind_address: "0.0.0.0"
  s1ap_port: 36412
  api_port: 8081
  sctp_mode: "tcp"        # "sctp" for native SCTP, "tcp" for length-prefixed fallback (dev)
  plmn: "00101"           # MCC=001, MNC=01 (test PLMN)
  hss_url: "http://localhost:8080"
  spgw_url: "http://localhost:8082"  # empty string disables S11 and falls back to local fake IP alloc
  tac: 1                  # Tracking Area Code
  mme_group_id: 1
  mme_code: 1
  relative_capacity: 127

spgw:
  name: "qcore-spgw"
  bind_address: "0.0.0.0"
  api_port: 8082
  s1u_port: 2152              # GTP-U UDP port (canonical)
  sgw_u1_addr: "127.0.0.1"    # address advertised to the MME for downlink encapsulation
  ue_pool: "10.45.0.0/24"     # UE IP allocation range
  gateway: "10.45.0.1"        # excluded from the allocation pool
  egress: "log"               # "log" — counts uplink packets (works everywhere); "tun" — Linux TUN device (see docs/PHASE3.md)
  tun_name: "qcore0"          # only used when egress=tun
  tun_mtu: 1400               # only used when egress=tun (GTP overhead-aware)

database:
  host: "localhost"
  port: 5432
  name: "qcore"
  user: "qcore"
  password: "qcore"
  ssl_mode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime_seconds: 300

logging:
  level: "info"
  format: "console"

metrics:
  enabled: true
  port: 9090

telemetry:
  collector_url: "http://localhost:9099"

# Diagnostic AI. The structured catalog always runs first and answers known
# symptoms with no model at all. `provider` only selects what happens when the
# catalog misses:
#   local  — offline embedded SLM (no cloud, no key). Talks to the qcore-slm
#            sidecar; start it with `make up-ai`. This is the default.
#   gemini — cloud escalation (bring-your-own-key); set api_key.
ai:
  provider: "local"                       # "local" (offline SLM) or "gemini" (cloud)
  model: "qwen2.5-1.5b-instruct"          # served model name (local) or cloud model id
  api_key: ""                             # required only if provider=gemini
  local_url: "http://localhost:8088/v1"   # offline SLM OpenAI-compatible endpoint

# 5G SA NFs — only needed when running the 5G stack
nrf:
  bind_address: "0.0.0.0"
  port: 8083

udr:
  bind_address: "0.0.0.0"
  port: 8084
  nrf_url: "http://localhost:8083"

udm:
  bind_address: "0.0.0.0"
  port: 8085
  nrf_url: "http://localhost:8083"
  udr_url: ""         # empty = direct-DB mode (dev); set to UDR URL for network mode
  plmn: "00101"
  # Demo SIDF HN private key for SUCI Profile A de-concealment. This matches
  # the public key in deployments/docker/ueransim-config/ue.yaml. Replace in
  # real labs; never publish or log production HN private keys.
  sidf_keys:
    - id: 1
      scheme: 1       # 1 = Profile A (X25519), 2 = Profile B (P-256)
      private_key_hex: "c53c22208b61860b06c62e5406a7b330c2b577aa5558981510d128247d38bd1d"

ausf:
  bind_address: "0.0.0.0"
  port: 8086
  nrf_url: "http://localhost:8083"
  udm_url: "http://localhost:8085"

amf:
  bind_address: "0.0.0.0"
  ngap_port: 38412
  api_port: 8087
  plmn: "00101"
  sctp_mode: "tcp"    # "sctp" for native SCTP (UERANSIM), "tcp" for dev
  serving_network_name: "5G:mnc001.mcc001.3gppnetwork.org"
  nrf_url: "http://localhost:8083"
  ausf_url: "http://localhost:8086"
  amf_instance_id: "00000000-0000-0000-0000-000000000001"
  amf_region_id: 1
  amf_set_id: 1
  amf_pointer: 0
  tac: 1

dashboard:
  bind_address: "0.0.0.0"
  port: 3000
  hss_url: "http://localhost:8080"
  mme_url: "http://localhost:8081"
  mme_s1ap_addr: "localhost:36412"   # built-in 4G simulator target
  amf_ngap_addr: "localhost:38412"   # built-in 5G simulator target
  spgw_url: "http://localhost:8082"
  collector_url: "http://localhost:9099"
  scenario_dir: "scenarios"          # file-backed authored scenario store
